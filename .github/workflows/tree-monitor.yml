name: Kiryat HaYovel Tree Monitor

on:
  schedule:
    - cron: "0 6,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/tree-monitor.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

  monitor:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tree permit monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPEAL_APP_BASE_URL: ${{ vars.APPEAL_APP_BASE_URL || format('https://{0}.github.io/{1}/index.html', github.repository_owner, github.event.repository.name) }}
          PERMITS_DB_PATH: data/permits.db
        run: python -m src.runner

      - name: Persist permits state database
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f agent/data/permits.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: update permits state db"
            git push
          fi
